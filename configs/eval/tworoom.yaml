defaults:
  - solver: cem
  - _self_

env_name: tworoom
seed: 1
checkpoint: null   # e.g. salt/tworoom/weights.pt (relative to $STABLEWM_HOME/checkpoints); null = random policy

world:
  env_name: swm/TwoRoom-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

dataset:
  keys_to_cache: [action, proprio]

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: tworoom
  callables:
    - method: _set_state
      args:
        state:
          value: proprio
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_proprio
